[package]
name = "dxlink"
version = "0.3.0"
edition = "2024"
# Measured, not guessed: 1.87 rejects the let-chains this crate uses.
# Raising this is a compatibility break for consumers and belongs in release notes.
rust-version = "1.88"
license = "MIT"
description = "Rust client for the DXLink WebSocket protocol: real-time market data from tastytrade/dxFeed"
repository = "https://github.com/joaquinbejar/DXlink"

include = [
    "benches/**/*",
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "examples/**/*.rs",
    "tests/**/*.rs",
    "Makefile",
    "rust-toolchain.toml",
    "Draws/**/*.png",
    "Docker/**/*.Dockerfile",
    "Docker/**/*.yml",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
tokio = { version = "1.53", features = ["full"] }
futures-util = "0.3"
tracing = "0.1"

[dev-dependencies]
# test-util drives virtual time so the keepalive test does not spend 20 real seconds.
tokio = { version = "1.53", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[[test]]
name = "tests"
path = "tests/integration/mod.rs"

[workspace]
members = [
    "examples/miscellaneous",
]

[workspace.dependencies]
dxlink = { path = "." }
